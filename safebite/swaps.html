<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBite — Swaps</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div class="custom-appy-cursor" id="appy-cursor"></div>

<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SAFEBITE<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li class="nav-item"><a href="dashboard.html"><span class="nav-frame"><img src="assets/appy/static/sit.png" alt=""></span>Dashboard</a></li>
      <li class="nav-item"><a href="scan.html"><span class="nav-frame"><img src="assets/appy/static/read.png" alt=""></span>Scan</a></li>
      <li class="nav-item"><a href="craving-search.html"><span class="nav-frame"><img src="assets/appy/static/drinkwalk.png" alt=""></span>Craving Search</a></li>
      <li class="nav-item"><a href="history.html"><span class="nav-frame"><img src="assets/appy/static/think.png" alt=""></span>History</a></li>
    </ul>
  </div>
</nav>

<main class="app-main">
  <div class="app-shell">
    <div class="app-topbar">
      <a href="javascript:history.back()" class="app-back">←</a>
      <div>
        <h1 class="app-heading split-title">Swaps for you</h1>
        <p class="app-subheading" id="swap-query">—</p>
      </div>
    </div>

    <div id="swap-results"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
<script>
const API_BASE = 'http://localhost:8000';
const params = new URLSearchParams(window.location.search);
const scanId = params.get('scanId');
const q = params.get('q');

const url = scanId ? `${API_BASE}/api/swaps/${scanId}` : `${API_BASE}/api/swaps?q=${encodeURIComponent(q || '')}`;

fetch(url)
  .then(r => r.json())
  .then(data => {
    document.getElementById('swap-query').textContent = `Based on: ${data.query}`;
    const root = document.getElementById('swap-results');
    if (!data.results.length){
      root.innerHTML = '<p>No swaps found — try a different craving.</p>';
      return;
    }
    root.innerHTML = data.results.map(item => `
      <div class="verdict-result" style="margin-bottom:1.2rem;">
        <div class="verdict-result-top">
          <span class="verdict-badge-lg verdict-badge-lg--safe">${item.name}</span>
        </div>
        <p>${item.why}</p>
        <p style="font-size:0.85rem;opacity:0.7;margin-top:0.4rem;"><strong>${item.macroDelta}</strong></p>
      </div>
    `).join('');
  })
  .catch(err => {
    console.error(err);
    document.getElementById('swap-results').innerHTML =
      `<p>Couldn't load swaps — is the backend running on ${API_BASE}?</p>`;
  });
</script>
</body>
</html>
